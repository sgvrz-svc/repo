[General]
include = base.conf
update-url = https://raw.githubusercontent.com/sgvrz-svc/repo/main/shadowrocket/mobile.conf

[Proxy Group]
MOBILE = url-test,interval=300,tolerance=25,timeout=5,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=(?=.*🇷🇺)(?=.*LTE)

[Rule]
RULE-SET,https://raw.githubusercontent.com/sgvrz-svc/repo/main/shadowrocket/list/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/sgvrz-svc/repo/main/shadowrocket/list/direct.list,DIRECT
FINAL,MOBILE